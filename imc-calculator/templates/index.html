<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cálculo de IMC</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h2>Cálculo do IMC</h2>
        <form id="imc-form">
            <label for="nome">Nome:</label><br>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required><br>

            <label for="altura">Altura (em metros):</label><br>
            <input type="number" id="altura" name="altura" step="0.01" placeholder="Ex: 1.75" required><br>

            <label for="peso">Peso (em kg):</label><br>
            <input type="number" id="peso" name="peso" step="0.1" placeholder="Ex: 70.5" required><br>

            <input type="button" value="Calcular IMC" onclick="calcularIMC()">
        </form>
    </div>

    <!-- Modal -->
    <div id="resultadoModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="fecharModal()">&times;</span>
            <p id="resultadoTexto"></p>
            <button onclick="limparCampos()">OK</button>
        </div>
    </div>

    <script>
        function calcularIMC() {
            const form = document.getElementById('imc-form');
            const formData = new FormData(form);
            
            fetch('/calcular_imc', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('resultadoTexto').innerText = data.resultado;
                document.getElementById('resultadoModal').style.display = 'block';
            })
            .catch(error => console.error('Erro:', error));
        }

        function fecharModal() {
            document.getElementById('resultadoModal').style.display = 'none';
        }

        function limparCampos() {
            document.getElementById('imc-form').reset();
            fecharModal();
        }
    </script>
</body>
</html>
